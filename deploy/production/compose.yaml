name: lucky5-production

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_USER: ${MYSQL_USER:-lucky5}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/02-lucky5-business.sql:/docker-entrypoint-initdb.d/02-lucky5-business.sql:ro
      - ./sql/03-real-market-routing.sql:/docker-entrypoint-initdb.d/03-real-market-routing.sql:ro
      - ./sql/04-base-config.sql:/docker-entrypoint-initdb.d/04-base-config.sql:ro
      - ./sql/05-sanitize-base-config.sql:/docker-entrypoint-initdb.d/05-sanitize-base-config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: lucky5-server:production
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom}
      MARKET_CREDENTIAL_KEY: ${MARKET_CREDENTIAL_KEY:?MARKET_CREDENTIAL_KEY is required}
    command:
      - --spring.profiles.active=local
      - --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      - --spring.datasource.dynamic.datasource.master.username=${MYSQL_USER:-lucky5}
      - --spring.datasource.dynamic.datasource.master.password=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      - --spring.datasource.dynamic.datasource.slave.username=${MYSQL_USER:-lucky5}
      - --spring.datasource.dynamic.datasource.slave.password=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - --spring.data.redis.host=redis
      - --lottery.draw-source.tenant-id=${LOTTERY_DRAW_SOURCE_TENANT_ID:-1}
      - --lottery.draw-source.user-id=${LOTTERY_DRAW_SOURCE_USER_ID:-1}
      - --lottery.market.real-writes-enabled=${LOTTERY_REAL_MARKET_WRITES_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:48080/v3/api-docs | grep --quiet '\"openapi\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  frontend:
    image: lucky5-ui:production
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
