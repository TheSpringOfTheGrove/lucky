# Temporary IP-only HTTPS test entry. Keep the domain virtual host unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name 119.29.205.24;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://119.29.205.24$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 119.29.205.24;

    ssl_certificate /etc/letsencrypt/live/119.29.205.24/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/119.29.205.24/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass https://47.242.201.44;
        proxy_ssl_server_name on;
        proxy_ssl_name origin.lucky5.internal;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/nginx/origin-root.crt;

        proxy_http_version 1.1;
        proxy_set_header Host origin.lucky5.internal;
        proxy_set_header X-Forwarded-Host 119.29.205.24;
        proxy_set_header X-Lucky-Public-Host 119.29.205.24;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lucky_connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
