# Install on the 119.29.205.24 edge server. The trusted origin CA certificate
# must be copied from the Caddy data volume to /etc/nginx/origin-root.crt.
map $http_upgrade $lucky_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 453400.80908.cn;

    ssl_certificate /etc/letsencrypt/live/453400.80908.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/453400.80908.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass https://47.242.201.44;
        proxy_ssl_server_name on;
        proxy_ssl_name origin.lucky5.internal;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/nginx/origin-root.crt;

        proxy_http_version 1.1;
        proxy_set_header Host origin.lucky5.internal;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Lucky-Public-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lucky_connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 453400.80908.cn;
    return 301 https://$host$request_uri;
}
